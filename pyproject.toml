[project]
name = "aegis"
version = "0.1.0"
description = "A stdlib-only, model- and deployment-agnostic agent-safety firewall."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = []                      # core has ZERO deps; everything ships stdlib-only

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
# Points at the in-package suite so the console script runs from ANY cwd.
aegis-evals = "aegis.adversarial:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
