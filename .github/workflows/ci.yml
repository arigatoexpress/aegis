name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read                     # least privilege
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a SHA, not a mutable tag (supply-chain hardening).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: make grep-clean
      - run: pytest -q
      - run: python evals/adversarial_suite.py   # evals are part of the gate
